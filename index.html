<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit a phone screen instead of a zoomed-out desktop view. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Log a film</title>

  <!-- Home-screen app settings: name, icon and colours (manifest.json), plus
       the extra tags iPhones look for. "Film log" is the name under the icon. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="Film log">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121014">

  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <!-- Two screens ("views"): only one is shown at a time, switched by the tab bar below. -->
  <main id="log-view">
    <h1>Log a film</h1>

    <form id="film-form" autocomplete="off">
      <label class="field">
        <span>Title</span>
        <input id="title" type="text" required autocapitalize="words" placeholder="e.g. Wildwood">
      </label>

      <label class="field">
        <span>Date watched</span>
        <input id="date" type="date" required>
      </label>

      <fieldset class="field">
        <legend>My rating <output id="rating-value">–</output></legend>
        <!-- 1 to 10 buttons are added by app.js; ½ adds half a point. -->
        <div id="rating-buttons" class="rating-grid"></div>
        <button type="button" id="half" class="chip half" aria-pressed="false">+ ½</button>
      </fieldset>

      <label class="field toggle">
        <span>Rewatch</span>
        <input id="rewatch" type="checkbox">
      </label>

      <!-- Only shown until the key is saved on this device. -->
      <label class="field" id="key-field" hidden>
        <span>Secret key (asked once per device)</span>
        <input id="key" type="password" autocomplete="off">
      </label>

      <button type="submit" id="save" class="save">Save film</button>
      <p id="status" role="status"></p>

      <!-- After a save: did TMDB find the film? Filled in by showResult() in app.js. -->
      <div id="result" class="result" role="status" hidden>
        <span id="result-icon" class="result-icon"></span>
        <div>
          <p id="result-heading" class="result-heading"></p>
          <p id="result-saved" class="result-saved"></p>
          <p id="result-detail" class="result-detail"></p>
        </div>
        <button type="button" id="result-close" class="result-close" aria-label="Dismiss">×</button>
      </div>
    </form>

    <button type="button" id="forget-key" class="link">Change key</button>
  </main>

  <main id="seen-view" hidden>
    <h1>Seen <span id="film-count" class="count"></span></h1>
    <!-- type="search" gives the phone a search keyboard and a clear (x) button. -->
    <input id="search" class="search" type="search" placeholder="Search films" autocomplete="off" autocapitalize="off" enterkeyhint="search">
    <p id="list-status" class="list-status" role="status"></p>
    <!-- Filled in by app.js: one <li> per film, newest first. -->
    <ol id="film-list" class="film-list"></ol>
  </main>

  <nav class="tabs">
    <button type="button" class="tab" data-view="log-view" aria-pressed="true">Log</button>
    <button type="button" class="tab" data-view="seen-view" aria-pressed="false">Seen</button>
    <!-- Stats is its own page (the cinema dashboard), so it's a link rather than a tab switch. -->
    <a class="tab" href="dashboard.html?v=9">Stats</a>
  </nav>

  <!-- Tapping a film in Seen opens this panel. Delete only shows for recent films. -->
  <div id="film-panel" class="overlay" hidden>
    <div class="sheet">
      <div class="grabber"></div>
      <div class="sheet-head">
        <span id="panel-title" class="panel-title"></span>
        <span id="panel-rating" class="panel-rating"></span>
      </div>
      <p id="panel-date" class="panel-date"></p>
      <button type="button" id="panel-delete" class="btn danger">Delete film</button>
      <button type="button" id="panel-close" class="btn">Close</button>
    </div>
  </div>

  <!-- "Are you sure?" before anything is deleted. -->
  <div id="confirm" class="overlay centred" hidden>
    <div class="dialog">
      <p id="confirm-question" class="dialog-question"></p>
      <p class="dialog-note">It moves to the Deleted tab in your Sheet, so you can restore it there if needed.</p>
      <button type="button" id="confirm-delete" class="btn danger">Delete</button>
      <button type="button" id="confirm-cancel" class="btn gold">Cancel</button>
    </div>
  </div>

  <!-- "?v=9" makes phones fetch the new files instead of reusing old saved copies.
       Bump the number whenever you change these files. -->
  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
